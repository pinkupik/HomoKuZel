name: Build Binaries

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Apple Silicon macOS (M1/M2/M3/M4)
          - os: macos-14
            target: aarch64-apple-darwin
            artifact_name: birdseye_tool-macos-arm64
          # Intel macOS
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: birdseye_tool-macos-x64
          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: birdseye_tool-windows-x64.exe
          # Linux
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: birdseye_tool-linux-x64

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libxkbcommon-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            target/${{ matrix.target }}/release/birdseye_tool
            target/${{ matrix.target }}/release/birdseye_tool.exe
