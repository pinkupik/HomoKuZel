name: Build Binaries

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Apple Silicon macOS (M1/M2/M3/M4)
          - os: macos-14
            target: aarch64-apple-darwin
            artifact_name: ConeFlattener-macOS-AppleSilicon
          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: ConeFlattener-Windows-x64
          # Linux
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: ConeFlattener-Linux-x64

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libxkbcommon-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package macOS .app Bundle
        if: runner.os == 'macOS'
        run: |
          mkdir -p "ConeFlattener.app/Contents/MacOS"
          mkdir -p "ConeFlattener.app/Contents/Resources"
          cp "target/${{ matrix.target }}/release/birdseye_tool" "ConeFlattener.app/Contents/MacOS/ConeFlattener"
          chmod +x "ConeFlattener.app/Contents/MacOS/ConeFlattener"
          cat << 'EOF' > "ConeFlattener.app/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>ConeFlattener</string>
              <key>CFBundleIdentifier</key>
              <string>com.formulastudent.coneflattener</string>
              <key>CFBundleName</key>
              <string>ConeFlattener</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>0.1.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF
          codesign --force --deep -s - "ConeFlattener.app"
          zip -r "ConeFlattener-macOS-AppleSilicon.zip" "ConeFlattener.app"

      - name: Upload macOS Bundle
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ConeFlattener-macOS-AppleSilicon.zip

      - name: Upload Windows / Linux Binary
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            target/${{ matrix.target }}/release/birdseye_tool
            target/${{ matrix.target }}/release/birdseye_tool.exe
