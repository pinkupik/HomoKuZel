[package]
name = "birdseye_tool"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[[bin]]
name = "birdseye_tool"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.27", default-features = false, features = ["default_fonts", "glow", "persistence", "x11"] }
egui = "0.27"
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }
nalgebra = "0.32"
rayon = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rfd = "0.14"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
